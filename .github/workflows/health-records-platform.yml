# CI for health-records-platform/ (the rest of this repository is a static portfolio site).
name: health-records-platform

on:
  push:
    paths: ["health-records-platform/**", ".github/workflows/health-records-platform.yml"]
  pull_request:
    paths: ["health-records-platform/**", ".github/workflows/health-records-platform.yml"]
  schedule:
    - cron: "17 3 * * 1" # weekly dependency audit even without code changes

permissions:
  contents: read

defaults:
  run:
    working-directory: health-records-platform

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: continuum
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: development
      APP_URL: http://localhost:3000
      DATABASE_URL: postgres://continuum_app:continuum_dev_only@127.0.0.1:54329/continuum
      DATABASE_ADMIN_URL: postgres://postgres@127.0.0.1:54329/continuum
      TEST_DATABASE_ADMIN_URL: postgres://postgres@127.0.0.1:54329/continuum_test
      TEST_DATABASE_URL: postgres://continuum_app:continuum_dev_only@127.0.0.1:54329/continuum_test
      # Throwaway CI-only values (not secrets): fixed so test runs are reproducible.
      APP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      IDENTIFIER_HASH_KEY: ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=
      CRON_SECRET: ci-only-cron-secret-value-0123456789
      IDENTITY_PROVIDER: sandbox
      ENABLE_DEV_MAILBOX: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: health-records-platform/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - name: Create test database
        run: psql -h 127.0.0.1 -p 54329 -U postgres -c "create database continuum_test"
      - name: Dependency audit (fails on high/critical)
        run: pnpm audit --prod --audit-level high
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Database, authorization and provider tests
        run: pnpm test
      - run: pnpm build
      - name: Browser flows, mobile, keyboard and accessibility
        run: |
          npx playwright install --with-deps chromium
          bash scripts/e2e.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-results, path: health-records-platform/test-results, retention-days: 7 }
