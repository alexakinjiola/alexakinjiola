# Local alternative to scripts/db-local.sh. After `docker compose up -d`, run `pnpm db:reset`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: continuum
    ports: ["54329:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  clamav:
    image: clamav/clamav:stable
    ports: ["3310:3310"]
    profiles: ["scanner"]
volumes:
  pgdata:
